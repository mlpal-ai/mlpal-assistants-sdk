name: Publish to Private PyPI

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

env:
  PYPI_SERVER_URL: ${{ secrets.PYPI_SERVER_URL }}

jobs:
  build-and-publish:
    name: Build and Publish Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract package name and version
        id: package-info
        run: |
          # Extract package name from pyproject.toml
          PACKAGE_NAME=$(grep '^name = ' pyproject.toml | sed 's/name = "\(.*\)"/\1/')
          echo "package-name=${PACKAGE_NAME}" >> $GITHUB_OUTPUT

          # Extract version from pyproject.toml
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          echo "Package: ${PACKAGE_NAME} v${VERSION}"

      - name: Build package
        run: |
          echo "Building ${{ steps.package-info.outputs.package-name }} v${{ steps.package-info.outputs.version }}..."
          uv build

      # Releases are immutable: the index refuses overwrites (409) and CI never
      # deletes a published file. An already-published version fails here with
      # a clear message instead; bump the version in pyproject.toml to publish.
      # Anonymous read over HTTP, so this job needs no cluster access.
      - name: Check version is not already published
        run: |
          WHEEL_FILE=$(basename dist/*.whl)
          INDEX_PAGE="${{ env.PYPI_SERVER_URL }}/simple/${{ steps.package-info.outputs.package-name }}/"
          STATUS=$(curl -sS -o index.html -w '%{http_code}' "$INDEX_PAGE")
          case "$STATUS" in
            200)
              if grep -qF "$WHEEL_FILE" index.html; then
                echo "::error::$WHEEL_FILE is already published. Releases are immutable; bump the version in pyproject.toml."
                exit 1
              fi
              ;;
            # pypiserver redirects names it does not host to its fallback index.
            303|404) ;;
            *)
              echo "::error::Unexpected HTTP $STATUS from $INDEX_PAGE"
              exit 1
              ;;
          esac
          rm -f index.html
          echo "$WHEEL_FILE is not on the index yet; publishing"

      - name: Install twine
        run: pip install twine

      - name: Publish to PyPI server
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_PUBLISH_USER }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PUBLISH_PASSWORD }}
        run: |
          : "${TWINE_USERNAME:?PYPI_PUBLISH_USER secret is not available to this repo}"
          : "${TWINE_PASSWORD:?PYPI_PUBLISH_PASSWORD secret is not available to this repo}"
          # Basic auth must not cross the network in clear text.
          case "${{ env.PYPI_SERVER_URL }}" in
            https://*) ;;
            *) echo "::error::PYPI_SERVER_URL must be an https:// URL"; exit 1 ;;
          esac
          echo "Publishing ${{ steps.package-info.outputs.package-name }} v${{ steps.package-info.outputs.version }} to ${{ env.PYPI_SERVER_URL }}..."
          twine upload \
            --repository-url "${{ env.PYPI_SERVER_URL }}" \
            --non-interactive \
            dist/*.whl

      - name: Verify publication
        run: |
          sleep 5
          curl -s ${{ env.PYPI_SERVER_URL }}/simple/${{ steps.package-info.outputs.package-name }}/ | grep "${{ steps.package-info.outputs.version }}"
          echo "Successfully published ${{ steps.package-info.outputs.package-name }} v${{ steps.package-info.outputs.version }}"

      - name: Deployment summary
        run: |
          echo "### Package Published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** ${{ steps.package-info.outputs.package-name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.package-info.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Install" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "pip install --index-url ${{ env.PYPI_SERVER_URL }}/simple/ ${{ steps.package-info.outputs.package-name }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
