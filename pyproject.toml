[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlpal-assistants"
version = "0.1.0"
description = "Official Python SDK for MLPal Assistants API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "MLPal", email = "engineering@mlpal.ai" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
keywords = ["mlpal", "assistants", "llm", "ai", "sdk"]

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "typing_extensions>=4.7.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "respx>=0.21.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/mlpal/mlpal-assistants-sdk"
Documentation = "https://docs.mlpal.ai/sdk"
Repository = "https://github.com/mlpal/mlpal-assistants-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/mlpal_assistants"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B024",   # Abstract base class without abstract methods
    "SIM102", # Use single if statement (readability preference)
    "SIM105", # Use contextlib.suppress (readability preference)
    "SIM108", # Use ternary operator (readability preference)
    "UP036",  # Version block outdated (keep for compatibility)
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
